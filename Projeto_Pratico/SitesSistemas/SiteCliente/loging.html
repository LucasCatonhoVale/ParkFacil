<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"  href="../SiteCliente/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="icon" tipo="imagem/png"  href="../SiteCliente/img/logoremov.png"><!--Adcionando o Logo ao lado do nome do site-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <title>ParkFacil</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="branco">
        <img src="../SiteCliente/img/logo.png" alt="logo">
    </div>
    <div class="fundo">
        <a id="voltar" href="../SiteCliente/index.html">Voltar</a>
    </div>
    <div class="formulario">
        <form action="">
            <h1>Bem-vindo de volta!</h1>
            <p>Faca login para acessar sua conta e <br> continuar usando o ParkFacil.</p>
            <div class="for01">
                <label for="E-mail" id="email1">E-mail</label>
                <br>
                <input type="email" id="email" name="E-mail" placeholder="Me Informe o seu E-mail:">
            </div>
            <div class="for01">
                <label for="Senha" id="Senha1">Senha</label>
                <br>
                <input type="password" id="senha" name="senha" placeholder="Me Informe sua senha:">
            </div>
            <br>
            <a id="sla" href="#">Esqueci minha senha</a>
            <button type="button" id="ent">
                Entrar  
            </button>
            <div class="li0nhas">
                <div class="linha01"></div>
                <p>OU</p>
                <div class="linnha02"></div>
            </div>
           <div class="google">
                <div id="g_id_onload"
                    data-client_id="SEU_CLIENT_ID.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse">
                </div>
                <div class="g_id_signin"
                        data-type="standard"
                        data-theme="outline"     
                        data-size="lague"            
                        data-text="signin_with"       
                        data-shape="rectangular"             
                        data-logo_alignment="center"
                        data-width="300">             <!-- largura em px -->
                </div>
           </div>
           <p id="cad">Não tem conta?<a href="../SiteCliente/cadastro.html">Cadastrar</a></p>
        </form>
    </div>
        <div id="alerta" class="alerta">
            <p id="mensagemAlerta"></p>
    </div>
</body>

<script src="../SiteCliente/js/Login.js"></script>
</html>
